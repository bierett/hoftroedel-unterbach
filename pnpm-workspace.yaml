packages:
  - src/**
  - "!**/test-data/**"
  - "!**/dist/**"

# https://pnpm.io/catalogs
catalog:
  # Trails OpenLayers base packages
  # https://github.com/open-pioneer/trails-openlayers-base-packages
  "@open-pioneer/geolocation": &ol_base_packages_version ^1.6.0
  "@open-pioneer/map-navigation": *ol_base_packages_version
  "@open-pioneer/map-ui-components": *ol_base_packages_version
  "@open-pioneer/map": *ol_base_packages_version

  # Trails core packages
  # https://github.com/open-pioneer/trails-core-packages
  "@open-pioneer/base-theme": &core_packages_version ^4.9.0
  "@open-pioneer/notifier": *core_packages_version
  "@open-pioneer/runtime": *core_packages_version

  # Frontend dependencies
  "@chakra-ui/react": ^3.37.0
  ol: ^10.11.0
  react: ^19.3.1

  # Devtools
  "@open-pioneer/build-package-cli": ^4.0.2
  "@open-pioneer/build-support": ^4.0.2
  "@open-pioneer/check-pnpm-duplicates": ^0.5.0
  "@open-pioneer/create-license-report": ^0.1.0
  "@open-pioneer/vite-plugin-pioneer": ^7.1.1
  "@tony.ganchev/eslint-plugin-header": ^3.4.4
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/js-yaml": ^4.0.9
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": "^6.1.2"
  "@vitest/browser-playwright": ^5.0.5
  "@vitest/browser-preview": ^5.0.5
  fast-glob: ^3.3.3
  happy-dom: ^21.0.4
  husky: ^9.1.7
  js-yaml: ^5.5.0
  jsdom: ^30.1.3
  lint-staged: ^17.6.0
  oxlint: ^1.89.0
  oxfmt: ^0.78.0
  playwright: ^1.64.1
  resize-observer-polyfill: ^1.5.1
  rimraf: ^6.1.4
  sass: ^1.106.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest-browser-react: ^2.3.0
  vite: ^8.3.6
  vitest: ^5.0.5

overrides:
  # We don't actually use the babel plugin.
  # The babel runtime is also not used as a production dependency.
  # See e.g. https://github.com/emotion-js/emotion/issues/2371
  "@emotion/react>@emotion/babel-plugin": "-"
  "@emotion/styled>@emotion/babel-plugin": "-"
  "@emotion/react>@babel/runtime": "-"
  "@emotion/styled>@babel/runtime": "-"

  # Resolve duplicate packages
  "stylis@<4.3.5": ">= 4.3.5"
  "csstype@<3.2.3": ">=3.2.3"
  "geotiff@>=3.0.5 <3.1.0-beta.0": "^3.1.0-beta.0"

  # Ensure patched packages have the expected version (patch was tested with this version):
  "@chakra-ui/react": "3.38.0"
  "@ark-ui/react": "5.39.0"
  "@zag-js/interact-outside": "1.43.3"

  # https://github.com/advisories/GHSA-253c-mchw-3w2r
  # https://github.com/advisories/GHSA-gfr2-rv44-r23c
  "markdown-it@<14.3.3": "^14.3.3"

  # https://github.com/advisories/GHSA-mrhx-c7xc-m3w5
  "zod@>=4.0.0 <4.6.6": "^4.6.6"

    # https://github.com/advisories/GHSA-3g3m-2fjr-6pw4
  "glob@>=9.0.0 <=14.0.1": "^14.0.2"

  #  https://github.com/advisories/GHSA-g3hv-75wg-m249
  #  typedoc (0.28.20) depends on minimatch 10.x (see ignoreGhsas)
  "minimatch@>=11.0.0 <=11.0.1": "^11.0.2"

allowUnusedPatches: true
patchedDependencies:
  # Ensure all portals are mounted under `.pioneer-root` div
  "@ark-ui/react@*": "patches/@ark-ui__react.patch"

  # Fixes 'interact-outside' logic not tabbing between elements within the same shadow dom.
  # Can be removed if https://github.com/chakra-ui/zag/issues/3088 is fixed.
  "@zag-js/interact-outside": patches/@zag-js__interact-outside.patch

# Install older versions by default
resolutionMode: "lowest-direct"

# Configure a release cooldown
minimumReleaseAge: 4320 # 3 days in minutes
minimumReleaseAgeExclude:
  - "@open-pioneer/*"
  - "@conterra/*"

peerDependencyRules:
  allowedVersions:
    # See overrides
    "fdir>picomatch": "*"
    "rollup": "*"

audit:
  level: "moderate"

auditConfig:
  ignoreGhsas:
    # typedoc (0.28.20) depends on minimatch 10.x (see overrides)
    - GHSA-g3hv-75wg-m249

permissions:
  "@parcel/watcher":
    build: true
  "@swc/core":
    build: true
  esbuild:
    build: true
  "@conterra/reactivity-core":
    skills: true
  "@open-pioneer/reactivity":
    skills: true

  # Seems to work without build scripts; may revisit later if actually needed.
  core-js:
    build: false
  unrs-resolver:
    build: false

# Do not allow to install packages which trust level has decreased
# (e.g. older version was signed but the version to be installed is not signed)
trustPolicy: no-downgrade
# Exclude packages from trustPolicy that are used in an old (major) version that was published after another signed version
trustPolicyExclude: []

# Workaround for current problems regarding our vite plugin + vite's optimizeDeps feature
shamefullyHoist: true

# Cyclic dependencies are a code smell but should not trigger hard errors in pnpm.
ignoreWorkspaceCycles: true

linkWorkspacePackages: false
strictPeerDependencies: true
