name: Audit dependencies (daily)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect dependency changes
        id: changes
        run: node .github/scripts/dependency-changes.mjs audit

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Audit reads pnpm-lock.yaml; installing dependencies is not necessary.
      - name: Audit all dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm audit --audit-level=moderate
