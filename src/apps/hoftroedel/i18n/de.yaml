    addressHelp: Tippe mindestens zwei Zeichen und wähle deine Adresse aus. Fehlt sie, kannst du sie selbst eingeben.
    addressEmpty: Keine passende Adresse gefunden. Du kannst deine Adresse manuell eingeben.
    email: Deine E-Mail-Adresse
