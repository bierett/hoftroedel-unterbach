messages:
  brand: Hoftrödel Unterbach
  eyebrow: Samstag, 19. September 2026 · ab 11 Uhr
  title:
    line1: Unterbacher
    line2: Hoftrödel.
    line3: 19.09.2026
  intro: Am Samstag, 19. September 2026, ab 11 Uhr wird Unterbach zum Flohmarkt. Die Stände stehen auf privaten Grundstücken und in Garagen. Komm vorbei, schlendere von Tür zu Tür und stöbere nach Fundstücken.
  event:
    participationTitle: Mit einem eigenen Stand teilnehmen
    participation: Du wohnst in Unterbach und möchtest selbst mittrödeln? Die Teilnahme ist kostenlos. Du baust deinen Stand selbst auf und bestimmst deine Öffnungszeiten.
    mapTitle: Karte und Adressliste
    mapDescription: Die Karte ist für die angemeldeten Stände vorgesehen. Eine Adressliste ergänzt die Karte. Wenn du der Veröffentlichung deiner Standadresse in der Liste widersprichst, erscheint dein Stand nur auf der Karte. Die Namen der Teilnehmenden werden nicht veröffentlicht.
    deadlineTitle: Anmeldefrist
    deadline: Melde deinen Stand bis zum 18. September 2026 an, damit er bei der Kartenerstellung berücksichtigt werden kann.
  registration:
    privacyNote: Informationen zur Verarbeitung deiner Angaben findest du in unseren
