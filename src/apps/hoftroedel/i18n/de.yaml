    mapOnlyLabel: Meine Standadresse nur auf der Karte anzeigen, nicht in der Adressliste.
    note: Das Formular öffnet eine vorausgefüllte E-Mail in deinem Mailprogramm. Sende sie dort ab, um deinen Stand anzumelden.
    submit: E-Mail vorbereiten
    prepared: Bitte sende die vorbereitete E-Mail in deinem Mailprogramm ab. Hier wurde noch keine Anmeldung versendet.
